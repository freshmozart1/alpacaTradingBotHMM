name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check merge helper syntax
        run: bash -n scripts/merge-claude-routine.sh
      - name: Run tests
        run: python3 -m unittest discover tests
