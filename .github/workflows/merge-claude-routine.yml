name: Merge Claude Routine updates

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-claude-routine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Run the merge helper from the trusted base branch.
          ref: main
          fetch-depth: 0

      - name: Create or find the pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # A newer push can arrive while this event waits in concurrency.
          if ref="$(git ls-remote --exit-code origin "refs/heads/$BRANCH")"; then
            read -r current_sha current_ref <<< "$ref"
            if [[ ! "$current_sha" =~ ^[0-9a-f]{40}$ || "$current_ref" != "refs/heads/$BRANCH" ]]; then
              echo "Invalid remote branch response for $BRANCH." >&2
              exit 1
            fi
            if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
              echo "Skipping superseded push $EXPECTED_SHA ($BRANCH is now $current_sha)."
              exit 0
            fi
          else
            status=$?
            if [[ "$status" -eq 2 ]]; then
              echo "Skipping $BRANCH: the branch was already deleted."
              exit 0
            fi
            exit "$status"
          fi

          number="$(gh pr list --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number')"

          if [[ -z "$number" ]]; then
            url="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Claude Routine update" \
              --body "Automated update from a Claude Code Routine.")"
            number="${url##*/}"
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Squash merge and delete the routine branch
        if: steps.pull-request.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: bash scripts/merge-claude-routine.sh "$PR_NUMBER" "$EXPECTED_SHA" "$BRANCH"
